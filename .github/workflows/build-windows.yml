name: Build Windows image

on:
  push:
    branches: [github-actions]
  workflow_dispatch:
    inputs:
      package:
        description: Flake package to build
        type: choice
        default: windows-11-24h2
        options:
          - windows-11-24h2
          - windows-11-25h2
          - windows-11-23h2
      upload_image:
        description: >-
          Also upload image.qcow2 as a workflow artifact (several GB). Off by
          default: artifacts of a public repo are downloadable by anyone, and
          the Windows evaluation licence does not allow redistribution.
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PACKAGE: ${{ inputs.package || 'windows-11-24h2' }}

    steps:
      - name: Free disk space
        run: |
          df -h /
          # The ISO, the installer payloads and the growing qcow2 need ~20G;
          # the runner starts with ~14G free on /.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /opt/microsoft /opt/google /usr/lib/jvm
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          nproc
          free -h

      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            # The installer runs QEMU with accel=kvm inside the build sandbox.
            extra-sandbox-paths = /dev/kvm

      - name: Build ${{ env.PACKAGE }}
        run: nix build ".#${PACKAGE}" --print-build-logs

      - name: Report
        if: always()
        run: |
          df -h /
          test -e result || { echo "No result: build failed"; exit 0; }
          VM=result/share/vm
          {
            echo "## ${PACKAGE}"
            echo
            echo '```'
            du -shL "$VM"/* 2>/dev/null
            echo
            nix shell nixpkgs#qemu-utils -c qemu-img info "$VM/image.qcow2" 2>/dev/null || true
            echo
            cat "$VM/summary/disk-space.txt" 2>/dev/null || true
            echo
            cat "$VM/summary/test-results.log" 2>/dev/null || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p artifact
          cp -rL "$VM/summary" artifact/ 2>/dev/null || true

      - name: Upload installation summary
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.PACKAGE }}-summary
          path: artifact/
          if-no-files-found: ignore

      - name: Upload disk image
        if: inputs.upload_image
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.PACKAGE }}-image
          path: |
            result/share/vm/image.qcow2
            result/share/vm/efi/
          compression-level: 0
          retention-days: 1
